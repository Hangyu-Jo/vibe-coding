<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포커스 타이머</title>
  <style>
    :root { --bg:#fff5f3; --card:#ffffff; --text:#1f1a19; --muted:#7a6f6c; --accent:#e5533d; --soft:#ffe4de; }
    body.break { --bg:#f0faf4; --accent:#1f9d55; --soft:#d9f2e3; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#17110f; --card:#211917; --text:#f5eeec; --muted:#b0a3a0; --accent:#ff7a63; --soft:#3a2420; }
      body.break { --bg:#0e1712; --accent:#4ade80; --soft:#183324; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; transition: background .3s; }
    .card { width:100%; max-width:360px; background:var(--card); border-radius:24px; padding:28px; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.08); }
    .modes { display:flex; gap:8px; justify-content:center; margin-bottom:20px; }
    .mode { border:none; background:var(--soft); color:var(--text); padding:8px 14px; border-radius:999px; font-weight:600; cursor:pointer; }
    .mode.active { background:var(--accent); color:#fff; }
    .time { font-size:72px; font-weight:800; font-variant-numeric: tabular-nums; letter-spacing:-.02em; }
    .label { color:var(--muted); margin-bottom:20px; }
    .controls { display:flex; gap:10px; justify-content:center; }
    .btn { border:none; padding:12px 22px; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; background:var(--soft); color:var(--text); }
    .btn.main { background:var(--accent); color:#fff; min-width:110px; }
    .custom { margin-top:20px; display:flex; gap:8px; justify-content:center; align-items:center; color:var(--muted); font-size:14px; }
    .custom input { width:64px; padding:6px; border-radius:8px; border:1px solid var(--soft); background:var(--card); color:var(--text); text-align:center; }
    .count { margin-top:16px; color:var(--muted); font-size:14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="modes">
      <button class="mode active" data-mode="focus">집중</button>
      <button class="mode" data-mode="break">휴식</button>
    </div>
    <div class="time" id="time">25:00</div>
    <div class="label" id="label">집중할 시간이에요 🔥</div>
    <div class="controls">
      <button class="btn main" id="start">시작</button>
      <button class="btn" id="reset">초기화</button>
    </div>
    <div class="custom">
      <label for="minutes">시간 직접 정하기</label>
      <input id="minutes" type="number" min="1" max="120" value="25"> 분
    </div>
    <div class="count" id="count">완료한 집중: 0회</div>
  </div>

  <script>
    const DEFAULTS = { focus: 25, break: 5 };
    const LABELS = { focus: "집중할 시간이에요 🔥", break: "잠깐 쉬어가요 🌿" };

    let mode = "focus";
    let total = DEFAULTS.focus * 60;   // 전체 시간 (초)
    let left = total;                  // 남은 시간 (초)
    let timerId = null;
    let done = 0;

    const timeEl = document.getElementById("time");
    const startBtn = document.getElementById("start");
    const minutesInput = document.getElementById("minutes");

    function render() {
      const m = String(Math.floor(left / 60)).padStart(2, "0");
      const s = String(left % 60).padStart(2, "0");
      timeEl.textContent = `${m}:${s}`;
      document.title = `${m}:${s} · 포커스 타이머`;
      startBtn.textContent = timerId ? "일시정지" : (left < total ? "계속" : "시작");
      document.getElementById("label").textContent = LABELS[mode];
      document.getElementById("count").textContent = `완료한 집중: ${done}회`;
      document.body.classList.toggle("break", mode === "break");
      document.querySelectorAll(".mode").forEach((b) => b.classList.toggle("active", b.dataset.mode === mode));
    }

    function stop() { clearInterval(timerId); timerId = null; }

    function tick() {
      left -= 1;
      if (left <= 0) {
        stop();
        if (mode === "focus") done += 1;
        // 끝나면 다음 모드로 자동 전환
        setMode(mode === "focus" ? "break" : "focus");
        beep();
        return;
      }
      render();
    }

    function setMode(next, minutes) {
      stop();
      mode = next;
      const min = minutes || DEFAULTS[next];
      minutesInput.value = min;
      total = min * 60;
      left = total;
      render();
    }

    function beep() {
      try {
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        osc.frequency.value = 880;
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) { /* 소리를 낼 수 없는 환경이면 넘어갑니다 */ }
    }

    startBtn.addEventListener("click", () => {
      if (timerId) stop();
      else timerId = setInterval(tick, 1000);
      render();
    });
    document.getElementById("reset").addEventListener("click", () => setMode(mode, Number(minutesInput.value)));
    document.querySelectorAll(".mode").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
    minutesInput.addEventListener("change", () => {
      const v = Math.min(120, Math.max(1, Number(minutesInput.value) || 1));
      setMode(mode, v);
    });

    render();
  </script>
</body>
</html>
