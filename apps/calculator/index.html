<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>심플 계산기</title>
  <style>
    :root { --bg:#f4f5f7; --pad:#ffffff; --key:#eceef2; --text:#16181d; --op:#4f46e5; --on-op:#fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1115; --pad:#171a21; --key:#252a34; --text:#eef0f4; --op:#818cf8; --on-op:#0f1115; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; }
    .calc { width:100%; max-width:320px; background:var(--pad); border-radius:20px; padding:20px; box-shadow:0 8px 24px rgba(0,0,0,.08); }
    .display { text-align:right; padding:8px 4px 16px; }
    .expr { min-height:20px; font-size:14px; opacity:.6; }
    .value { font-size:40px; font-weight:700; overflow-wrap:anywhere; }
    .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    button { border:none; border-radius:14px; padding:18px 0; font-size:20px; font-weight:600; background:var(--key); color:var(--text); cursor:pointer; }
    button:active { transform:scale(.96); }
    .op { background:var(--op); color:var(--on-op); }
    .wide { grid-column:span 2; }
  </style>
</head>
<body>
  <div class="calc">
    <div class="display">
      <div class="expr" id="expr"></div>
      <div class="value" id="value">0</div>
    </div>
    <div class="keys">
      <button data-action="clear">AC</button>
      <button data-action="sign">±</button>
      <button data-action="percent">%</button>
      <button class="op" data-op="/">÷</button>
      <button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button>
      <button class="op" data-op="*">×</button>
      <button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button>
      <button class="op" data-op="-">−</button>
      <button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button>
      <button class="op" data-op="+">+</button>
      <button class="wide" data-num="0">0</button>
      <button data-num=".">.</button>
      <button class="op" data-action="equals">=</button>
    </div>
  </div>

  <script>
    // 계산기 상태: 지금 입력 중인 숫자, 앞에 저장된 숫자, 고른 연산자
    let current = "0";
    let previous = null;
    let operator = null;
    let justCalculated = false;

    const valueEl = document.getElementById("value");
    const exprEl = document.getElementById("expr");
    const symbols = { "+": "+", "-": "−", "*": "×", "/": "÷" };

    function render() {
      valueEl.textContent = current;
      exprEl.textContent = previous !== null && operator ? `${previous} ${symbols[operator]}` : "";
    }

    function inputNumber(n) {
      if (justCalculated) { current = "0"; justCalculated = false; }
      if (n === "." && current.includes(".")) return;
      current = current === "0" && n !== "." ? n : current + n;
      render();
    }

    function compute(a, b, op) {
      const x = parseFloat(a), y = parseFloat(b);
      let r;
      if (op === "+") r = x + y;
      if (op === "-") r = x - y;
      if (op === "*") r = x * y;
      if (op === "/") r = y === 0 ? NaN : x / y;
      if (!isFinite(r)) return "오류";
      return String(parseFloat(r.toPrecision(12)));
    }

    function chooseOperator(op) {
      if (current === "오류") return;
      if (previous !== null && operator && !justCalculated) {
        current = compute(previous, current, operator);
      }
      previous = current;
      operator = op;
      justCalculated = true;
      render();
    }

    function equals() {
      if (previous === null || !operator) return;
      current = compute(previous, current, operator);
      previous = null;
      operator = null;
      justCalculated = true;
      render();
    }

    document.querySelector(".keys").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.num) return inputNumber(b.dataset.num);
      if (b.dataset.op) return chooseOperator(b.dataset.op);
      const a = b.dataset.action;
      if (a === "clear") { current = "0"; previous = null; operator = null; justCalculated = false; render(); }
      if (a === "sign" && current !== "0" && current !== "오류") { current = current.startsWith("-") ? current.slice(1) : "-" + current; render(); }
      if (a === "percent" && current !== "오류") { current = String(parseFloat(current) / 100); render(); }
      if (a === "equals") equals();
    });

    // 키보드 입력 지원
    document.addEventListener("keydown", (e) => {
      if (/^[0-9.]$/.test(e.key)) inputNumber(e.key);
      else if (["+", "-", "*", "/"].includes(e.key)) chooseOperator(e.key);
      else if (e.key === "Enter" || e.key === "=") equals();
      else if (e.key === "Escape") { current = "0"; previous = null; operator = null; render(); }
      else if (e.key === "Backspace" && !justCalculated) { current = current.length > 1 ? current.slice(0, -1) : "0"; render(); }
    });
  </script>
</body>
</html>
