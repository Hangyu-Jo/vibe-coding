<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한 줄 메모장</title>
  <style>
    :root { --bg:#fbf8ef; --card:#ffffff; --text:#1d1b16; --muted:#7c766a; --line:#ece6d6; --accent:#c28a00; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14120d; --card:#1e1b14; --text:#f3efe4; --muted:#ada592; --line:#332e22; --accent:#f5b81a; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding:24px 16px; }
    .wrap { max-width:480px; margin:0 auto; }
    h1 { font-size:24px; margin:0 0 4px; }
    .sub { color:var(--muted); font-size:14px; margin-bottom:16px; }
    form { display:flex; gap:8px; margin-bottom:16px; }
    input { flex:1; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; }
    button { border:none; border-radius:10px; padding:0 16px; font-weight:700; cursor:pointer; background:var(--accent); color:#fff; }
    ul { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
    li { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; display:flex; gap:12px; align-items:flex-start; }
    li .text { flex:1; overflow-wrap:anywhere; }
    li time { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
    li .del { background:none; color:var(--muted); padding:0 4px; font-size:18px; }
    .empty { text-align:center; color:var(--muted); padding:32px 0; }
    .notice { font-size:13px; color:var(--accent); margin-bottom:12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📒 한 줄 메모장</h1>
    <p class="sub">떠오른 생각을 바로 적어 두세요.</p>
    <p class="notice" id="notice" hidden>지금은 저장할 수 없는 환경이라, 창을 닫으면 메모가 사라져요.</p>
    <form id="form">
      <input id="input" placeholder="메모를 입력하고 Enter" maxlength="200" autocomplete="off">
      <button type="submit">추가</button>
    </form>
    <ul id="list"></ul>
  </div>

  <script>
    const KEY = "oneline-memo";
    let canSave = true;
    let memos = [];

    // 미리 써보기 창에서는 저장소를 쓸 수 없을 수 있어서 try로 감쌉니다
    try {
      memos = JSON.parse(localStorage.getItem(KEY) || "[]");
    } catch (e) {
      canSave = false;
      document.getElementById("notice").hidden = false;
    }

    function save() {
      if (!canSave) return;
      try { localStorage.setItem(KEY, JSON.stringify(memos)); } catch (e) { /* 무시 */ }
    }

    function render() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      if (memos.length === 0) {
        list.innerHTML = '<li class="empty" style="display:block;border:none;background:none">아직 메모가 없어요.</li>';
        return;
      }
      memos.forEach((m) => {
        const li = document.createElement("li");
        const box = document.createElement("div");
        box.className = "text";
        box.textContent = m.text;   // 입력한 글자를 그대로 보여줍니다 (HTML로 해석하지 않음)
        const time = document.createElement("time");
        time.textContent = new Date(m.at).toLocaleString("ko-KR");
        box.appendChild(time);
        const del = document.createElement("button");
        del.className = "del";
        del.title = "삭제";
        del.textContent = "×";
        del.addEventListener("click", () => {
          memos = memos.filter((x) => x.id !== m.id);
          save();
          render();
        });
        li.append(box, del);
        list.appendChild(li);
      });
    }

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text) return;
      memos.unshift({ id: Date.now(), text, at: new Date().toISOString() });
      input.value = "";
      save();
      render();
    });

    render();
  </script>
</body>
</html>
