<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>deepsolve · 바이브 코딩 앱 마켓</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .hero { text-align: center; padding: 24px 0 32px; }
    .hero h1 { font-size: clamp(26px, 4vw, 38px); letter-spacing: -0.02em; line-height: 1.3; }
    .hero p { margin-top: 8px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }
    .search { flex: 1 1 260px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .chip {
      border: 1px solid var(--line); background: var(--surface); color: var(--muted);
      padding: 6px 14px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .chip.active { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
    .sort { width: auto; }
    .result-count { font-size: 14px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <!-- 히어로 영역 -->
    <section class="hero">
      <h1>바이브 코딩으로 만든 앱을<br>체험하고 사고파는 곳</h1>
      <p class="muted">60초 동안 미리 써보고, 마음에 들면 포인트로 구매하세요.</p>
    </section>

    <!-- 검색과 정렬 -->
    <div class="toolbar">
      <input class="input search" id="search" type="search" placeholder="🔍 앱 이름이나 소개로 검색">
      <select class="select sort" id="sort" aria-label="정렬">
        <option value="newest">최신순</option>
        <option value="popular">인기순</option>
        <option value="price-asc">낮은 가격순</option>
        <option value="price-desc">높은 가격순</option>
      </select>
    </div>

    <!-- 카테고리 필터 -->
    <div class="chips" id="chips"></div>

    <!-- 앱 카드 목록 -->
    <p class="result-count muted" id="result-count"></p>
    <div class="app-grid" id="app-grid"></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
